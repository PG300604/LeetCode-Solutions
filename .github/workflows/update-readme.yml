name: Update README on New Solution

# Triggers whenever a new solution is committed to problems/**,
# or when triggered manually via workflow_dispatch, or daily at midnight UTC
on:
  push:
    branches: [main]
    paths:
      - "problems/**"
      - "scripts/**"
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run README updater
        run: python scripts/update_readme.py

      - name: Commit and push if README changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || (git commit -m "docs: auto-update README catalog with latest solutions [skip ci]" && git push)
