name: Update README on New Solution

# Runs automatically when a .java file is pushed to main,
# and can also be triggered manually from the Actions tab
# (useful for backfilling solutions committed before this workflow existed)
on:
  push:
    branches: [main]
    paths:
      - "*.java"
  workflow_dispatch:

# Let the workflow push the updated README back to the repo
permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run README updater
        run: python scripts/update_readme.py

      - name: Commit and push if README changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "auto: update README with latest solutions"
          git push
